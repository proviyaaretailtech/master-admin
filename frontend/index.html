<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proviyaa · Master Admin</title>
    <style>
      /* Boot splash: visible until the app (and the saved language) is ready, so a Hindi user
         never sees English first. It carries no text on purpose; React replaces it on render. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f9fa;
      }
      #boot-splash i {
        width: 2rem;
        height: 2rem;
        border-radius: 9999px;
        border: 4px solid #65d000;
        border-top-color: transparent;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <div id="root">
      <div id="boot-splash" role="progressbar" aria-busy="true"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
